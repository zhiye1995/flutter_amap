group = "com.morbit.amap_flutter"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "1.8.22"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.5.0")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.morbit.amap_flutter"
    compileSdk = flutter.compileSdkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 21
        // 将高德 SDK 的混淆规则自动传递给集成方 App（App 开启 R8/ProGuard 时会生效）
        consumerProguardFiles("consumer-rules.pro")
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    dependencies {
        // 3D地图
//        implementation 'com.amap.api:3dmap:9.8.3'
        // 2D地图
//        implementation 'com.amap.api:map2d:latest.integration'
        // 导航
//        implementation 'com.amap.api:navi-3dmap:latest.integration'
        // 搜索
//        implementation 'com.amap.api:search:latest.integration'
        // 定位
//        implementation 'com.amap.api:location:latest.integration'

//        implementation 'com.amap.api:navi-3dmap-location-search:latest.integration'
        implementation 'com.amap.api:navi-3dmap-location-search:10.1.600_3dmap10.1.600_loc6.5.1_sea9.7.4'
//        implementation 'com.amap.api:navi-3dmap-location-search:11.1.200_3dmap11.1.200_loc11.1.200_sea9.7.4'
//        implementation 'com.amap.api:navi-3dmap-location-search:11.2.000_3dmap11.2.000_loc11.2.000_sea9.8.0'

        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events "passed", "skipped", "failed", "standardOut", "standardError"
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }
}
