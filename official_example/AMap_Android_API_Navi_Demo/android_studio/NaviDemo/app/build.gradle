apply plugin: 'com.android.application'

android {
    namespace 'com.amap.navi.demo'
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.amap.navi.demo"
        minSdkVersion 19
        targetSdkVersion 33
        multiDexEnabled true
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        debug {
            //testCoverageEnabled true
        }
    }
    sourceSets {
        main {
            // Maven 合包已自带 .so，无需再指定 libs 下的 jniLibs
            // jniLibs.srcDirs = ['libs']
        }
    }

    // 旧版 demo 只打包 armeabi，现代设备需要 arm64-v8a / armeabi-v7a
    // splits {
    //     abi {
    //         enable true
    //         reset()
    //         include 'armeabi'
    //     }
    // }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
//    compile fileTree(include: ['*.jar'], dir: 'libs')
//    androidTestCompile('com.android.support.test.espresso:espresso-core:2.2.2', {
//        exclude group: 'com.android.support', module: 'support-annotations'
//    })
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.annotation:annotation:1.6.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // 导航 + 3D地图 + 定位 + 搜索 合包（Maven Central）
    implementation 'com.amap.api:navi-3dmap-location-search:11.2.000_3dmap11.2.000_loc11.2.000_sea9.8.0'

    // 讯飞语音（仅 IflyVoice 示例需要，与高德 SDK 无关）
    implementation files('libs/Msc.jar')
}
